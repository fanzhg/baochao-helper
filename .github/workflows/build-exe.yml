name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build single-file EXE
        run: |
          pyinstaller --noconfirm --onefile --name "爆炒江湖配队助手" `
            --add-data "web;web" `
            --add-data "data/baiweilou_floors.json;data" `
            app.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: baochao-helper-windows-exe
          path: dist/爆炒江湖配队助手.exe

      - name: Attach to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/爆炒江湖配队助手.exe
